[pytest]
DJANGO_SETTINGS_MODULE = bookhop.settings.dev
python_files = test_*.py
testpaths = tests
# REDTEAM-S2 F54: red-team probes are deliberately-red measurements, not
# regressions. Without this they join the count both gates quote, which is
# how a probe tree silently becomes a second QA suite. tests/redteam/conftest.py
# also skips them unless BOOKHOP_REDTEAM=1, so running them is always explicit.
norecursedirs = tests/redteam
addopts = -ra --strict-markers
markers =
    engine_specific: asserts something that is only true on one database engine

# locale/FORBIDDEN_EXCEPTIONS.toml
#
# Owner: frontend-developer (TASKS §1). Read by
# `tests/unit/test_forbidden_copy.py` (backend-developer, THREAT-MODEL
# §6.1(a)).
#
# The English deny-list is eight words, whole-word, with their inflections
# enumerated rather than stemmed:
#
#   safe · verified · guaranteed · protected · assured · trusted · certified ·
#   authentic
#
# plus Ban 2's phrases — "pay the listed price", "fixed price",
# "non-negotiable", "final price" — and the bare label "Price"
# (COPY-DECK §1.1, COMPLIANCE §4.3.1).
#
# A banned word may appear only in a msgid listed under [strings] below, by
# name, with a reason and a reviewer.
#
# A DIFF TO THIS FILE IS A CODE REVIEW ESCALATION, NOT A REVIEW COMMENT
# (TASKS §1).
#
# ===========================================================================
# STATUS AT S1: NO STRING EXCEPTION IS NEEDED. [strings] IS EMPTY.
# ===========================================================================
# All 122 S1 strings were scanned against the eight words and their
# inflections, against Ban 2's four phrases, against a bare "Price" label and
# against an @-prefixed domain literal (criterion 7f). Zero findings in shipped
# copy. The deck's engineering holds: the trust strings say what we did NOT do
# ("BookHop hasn't checked this book"), name a mechanism ("Signed in with a
# college email address"), or instruct ("Look at the book before you hand over
# any money") — none of them needs a banned word.
#
# COMPLIANCE §8.2 requires the privacy notice to use the phrase "data
# protection" (the Data Protection Board, the Act's own name). That text lives
# in `notice_versions` rows, which are backend's, NOT in a template or a .po —
# so it is outside this test's scope and needs no entry here. **If the notice
# body is ever moved into a .po, it needs one**, and that is the single most
# likely future entry in this file. Recorded now so the next person does not
# weaken the word list instead.
#
# ---------------------------------------------------------------------------
# ONE SHAPE EXEMPTION IS NEEDED, AND IT IS NOT A STRING EXEMPTION
# ---------------------------------------------------------------------------
# The deny-list run over raw template source produces 7 findings, all of them
# the word "trust" inside a gettext **context key**: `trust.campus_mail`,
# `trust.not_checked`, `trust.check_yourself`, `trust.no_ratings`,
# `trust.recourse`, `trust.exif`. These are COPY-DECK's own key names.
#
# CLAUDE.md rule 13 gives the order of resort, and resort 1 — rename our own
# name — does not apply, because **this name is not ours to rename**:
# COMPLIANCE §2.5a cites `trust.campus_mail` by name, and COPY-DECK §1.5a
# already ruled on it: "the token key stays `trust.campus_mail` for continuity
# with COMPLIANCE.md §2.5a… renaming a key that a ruling cites by name would
# cost more than it buys." That is resort 2: exempt the shape, ratified,
# because the colliding name is mandated by a frozen contract.
#
# THE EXEMPTION IS THE SHAPE, NEVER A STRING. The test must scan the
# TRANSLATABLE TEXT, not the raw bytes of the file:
#
#   * exempt: the `context "…"` argument of `{% translate %}` /
#     `{% blocktranslate %}`, the first argument of `pgettext` /
#     `pgettext_lazy`, and a `msgctxt "…"` line in a .po file;
#   * NOT exempt: every msgid, every msgid_plural, every msgstr, and every
#     other byte of a template.
#
# CLAUDE.md rule 14 requires naming the layer that still catches what this
# lets through. Two do, and the set of accepted *shipped strings* is unchanged
# by this exemption:
#
#   1. the deny-list itself, which still runs over every msgid and msgstr — a
#      banned word in copy is caught exactly as before;
#   2. Code Review's COPY-DECK §1.2 sentence check, which is the only thing
#      that catches "Trusted seller" and "You'll be fine" in any case, since
#      neither contains a banned word.
#
# So this is a clarification of what the control reads, not a widening of what
# it accepts. A key name is not copy: no student ever sees `trust.campus_mail`.
#
# COROLLARY, and it is the reason the shape rule matters more than this one
# collision: the test must also strip `{% comment %}` bodies. Every rationale
# in `templates/**` quotes the banned words in order to explain why they are
# banned — this file does too. A test that fires on its own rationale is a test
# that gets edited under schedule pressure, which is rule 13's whole point.
# ---------------------------------------------------------------------------

# ===========================================================================
# S2 UPDATE, 2026-10-22 — THE "price" MATCHER IS BROADER THAN THE BAN, AND S2
# IS THE SLICE THAT MAKES THAT VISIBLE. ONE SHAPE EXEMPTION PROPOSED; NO
# STRING EXEMPTION, AND [strings] STAYS EMPTY.
# ===========================================================================
# S1 shipped no rupee figure, so no string contained the word "price" and the
# scan was clean. S2 ships the sell flow and the listing page, and the scan now
# reports **six findings, all of the token `price`, and nothing else** — zero
# findings across all eight vouching words and zero across Ban 2's four
# phrases. Measured, not asserted: `tests/unit/test_forbidden_copy.py`'s own
# `findings(translatable_text(...))` over `templates/**` and `locale/en/**`.
#
# The six, with where each one comes from:
#
#   price.label.full      "Seller's asking price"
#   price.negotiable      "This is what the seller is asking. The two of you
#                          agree the actual price between yourselves."
#   price.seller.hint     "This is the price you're asking for. …"
#   sell.price.locked     "You can't change this number later. You can still
#                          agree a different price when you meet."
#   sell.empty.body       "… the ISBN from the back of the book, what's wrong
#                          with it, and your price."
#   sell.price.relist     "To ask a different price, take this down and put it
#                          up again. …"
#
# **Five of the six are COPY-DECK §3.1 and §6.1 verbatim and four of them are
# B4 — each one carries a limb of the s194-O position.** `price.label.full` is
# the one that cannot move at all: Q9's statement of facts already asserts to
# counsel that *"the asking price is labelled as the seller's asking price
# throughout"*, so a rename makes a representation to counsel false.
#
# ---------------------------------------------------------------------------
# WHY THIS IS A MATCHER DEFECT AND NOT A COPY DEFECT
# ---------------------------------------------------------------------------
# ADR-003 §2.3 and COPY-DECK §1.1 Ban 2 forbid **the bare label "Price"**.
# SYSTEM.md criterion 7b says the same thing in its own words — *"no element
# whose visible label or `<th>` is the bare word 'Price'"* — and adds that the
# bare-label limb *"needs a rendered-DOM check as well as a grep"*.
#
# `apps/core/copy_rules.py` carries `BANNED_LABELS = ("price",)` and
# `findings()` matches it as `\bprice\b` **anywhere in any translatable text**.
# That is strictly broader than the rule it implements: it bans the ordinary
# English noun in prose, including in the exact replacement strings §3.1
# prescribes for the banned label. The deck's own §10.2 row points at
# `price.label.full` as the thing to use instead of "Price" — and the matcher
# refuses it.
#
# This is CLAUDE.md rule 13 arriving on schedule: *"a guard that fires on the
# contracts it protects will be edited, not obeyed."* Resort 1 (rename our own
# name) does not apply — the wording is COMPLIANCE §4.3.1's and counsel's, not
# ours. So: resort 2, exempt the shape, ratified.
#
# **The copy was NOT reworded to make the scan green.** Two strings were
# drafted with "amount" substituted for "price" while this file was being
# written and both were reverted, because quietly editing mandated legal copy
# so an over-broad grep stays green is the precise failure rule 13 describes.
# The red test is the honest state and it names a real defect in the control.
#
# ---------------------------------------------------------------------------
# THE PROPOSED NARROWING, AS A PROPERTY RATHER THAN A LIST (rule 11)
# ---------------------------------------------------------------------------
# `BANNED_LABELS` should be matched **only against label-shaped text**, and
# permitted there when the label names whose number it is:
#
#   a string is LABEL-SHAPED when, trimmed, it has no sentence-ending
#   punctuation and at most four words;
#   a label-shaped string containing "price" is a FINDING unless it also
#   contains "asking".
#
# Against the real corpus: "Price" is caught. "Max price" is caught — which
# matters, because `price.filter.label` exists to prevent exactly that
# (COPY-DECK §3.1). "Seller's asking price" and "Asking price" pass, which is
# the whole point. Prose stops being matched, because prose is not a label and
# was never what the ban was about.
#
# **CLAUDE.md rule 12 — the other layer, named.** Prose misuse is what
# `BANNED_PHRASES` is for, and it is untouched by this: "pay the listed
# price", "fixed price", "non-negotiable" and "final price" are matched as
# whole phrases wherever they appear, in prose or in a label. So the narrowing
# removes coverage of **no sentence anyone has argued is forbidden** — it
# removes coverage of the word, which only Ban 2's phrase list and the
# label rule were ever meant to reach. Criterion 7b's rendered-DOM check
# remains unwritten and remains the right second layer; it is named in the
# escalation.
#
# `apps/core/copy_rules.py` and `tests/unit/test_forbidden_copy.py` are
# **backend-developer's** (TASKS §1), so this file can only propose. Raised to
# cto in the S2 slice note. Until it lands,
# `test_no_shipped_english_string_contains_a_banned_word` is RED on six
# strings and that red is correct.
# ---------------------------------------------------------------------------

[meta]
source = "company/design/COPY-DECK.md §1.1 · company/architecture/THREAT-MODEL.md §6.1(a)"
locale = "en"
match = "whole-word, case-insensitive, inflections enumerated not stemmed"
scanned_at_S1 = 122
findings_in_shipped_copy_at_S1 = 0
scanned_at_S2 = 254
findings_in_shipped_copy_at_S2 = 6
findings_at_S2_note = "All six are the token `price` in prose, in strings COPY-DECK §3.1/§6.1 mandate. Zero findings across the eight vouching words and zero across Ban 2's four phrases. See [shapes.bare_label]."

# The shape rule above, as data, so the test does not hand-copy it
# (CLAUDE.md rule 10). These name what the scanner must EXCLUDE from the text
# it matches against; they are not string exceptions.
[shapes.msgctxt]
why = "A gettext context key is an identifier, never copy. COPY-DECK keys the trust strings `trust.*` and COMPLIANCE §2.5a cites one by name, so the name is not ours to rename (CLAUDE.md rule 13 resort 2)."
applies_to = [
  "the `context \"…\"` argument of {% translate %} and {% blocktranslate %}",
  "the first argument of pgettext() and pgettext_lazy()",
  "a `msgctxt \"…\"` line in a .po file",
]
never_applies_to = ["msgid", "msgid_plural", "msgstr", "msgstr[n]", "any other template text"]
other_layer = "The deny-list still scans every msgid and msgstr; Code Review still applies COPY-DECK §1.2 to sentences."
ratified_by = "PENDING — cto/code-review. Recorded by frontend-developer at S1; this file is the proposal, not the ratification."

[shapes.bare_label]
why = "ADR-003 §2.3 and COPY-DECK §1.1 Ban 2 forbid the BARE LABEL \"Price\", and criterion 7b says so in those words. `BANNED_LABELS` is matched as `\\bprice\\b` over all translatable text, which bans the ordinary noun in prose — including in the four B4 strings COPY-DECK §3.1 prescribes as the replacement for the banned label, one of which (`price.label.full`) is asserted to counsel by name. CLAUDE.md rule 13 resort 2: the colliding name is mandated by a frozen contract and is not ours to rename."
applies_to = [
  "a `BANNED_LABELS` token matched against text that is NOT label-shaped",
  "label-shaped means: trimmed, no sentence-ending punctuation, at most four words",
  "a label-shaped string containing the token is still a finding unless it also contains \"asking\"",
]
never_applies_to = [
  "BANNED_WORDS and its inflections, which are unchanged everywhere",
  "BANNED_PHRASES, which stay matched as whole phrases in prose and in labels",
  "a label-shaped string with no \"asking\" in it — \"Price\" and \"Max price\" stay findings",
]
other_layer = "BANNED_PHRASES independently catches every prose misuse anyone has named: \"pay the listed price\", \"fixed price\", \"non-negotiable\", \"final price\". Criterion 7b's rendered-DOM check is the intended second layer for the label limb and is NOT YET WRITTEN — stated here rather than implied, because an unbuilt layer is not a layer (CLAUDE.md rule 12)."
proposed_by = "frontend-developer, S2"
implemented_in = "apps/core/copy_rules.py + tests/unit/test_forbidden_copy.py — backend-developer's files (TASKS §1). NOT IMPLEMENTED. The guard is RED on six strings until it is, and that red is the correct state."
ratified_by = "PENDING — cto/code-review."

[shapes.template_comment]
why = "Every rationale in templates/** and in this file quotes the banned words to explain the ban. A guard that fires on its own rationale gets edited, not obeyed (CLAUDE.md rule 13)."
applies_to = ["{% comment %}…{% endcomment %} bodies", "# comment lines in a .po file", "// comments in templates/sw.js"]
never_applies_to = ["any rendered text"]
other_layer = "A comment is never served to a student; the scan over rendered text is unaffected."
ratified_by = "PENDING — cto/code-review."


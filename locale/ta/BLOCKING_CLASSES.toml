# locale/ta/BLOCKING_CLASSES.toml
#
# Owner: frontend-developer (TASKS §1). Read by `tests/unit/test_locale_gate.py`
# (backend-developer, THREAT-MODEL §6.1(c) point 2), which asserts that
# `feature_flags['i18n.ta_enabled']` CANNOT be true while any blocking-class
# msgid is missing from `locale/ta/REVIEWED.toml` or is hash-mismatched.
#
# A DIFF TO THIS FILE IS A CODE REVIEW ESCALATION, NOT A REVIEW COMMENT
# (TASKS §1, THREAT-MODEL §6.1): narrowing a pattern here is functionally the
# same as granting a sign-off, because it removes strings from the gate.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE DECLARES PATTERNS AND NOT A LIST OF msgids
# ---------------------------------------------------------------------------
# CLAUDE.md rule 11: "a list that cannot express its own exceptions gets edited
# instead of extended", and rule 15: "an invariant beats a list — ask the
# property, don't enumerate the cases."
#
# An enumerated list of blocking msgids would be wrong the moment the next
# slice adds a string. S1 ships 122 strings; S2-S7 add the listing, offer,
# handover, confirm, report and dispute copy, and the handover guidance (B1) is
# **entirely in a later slice** — so a list written today would name zero B1
# strings and silently report full coverage of the most safety-critical class
# in the deck. Somebody would then have to remember to extend it, six times.
#
# A prefix rule cannot fail that way. A new string called `hand.guidance.5` is
# blocking the moment it is written, with nobody remembering anything. The cost
# is that the rule is coarse — it can over-include — and over-including is the
# right direction for a gate that fails closed.
#
# THE CEILING, DECLARED HERE RATHER THAN DISCOVERED LATER: a prefix rule cannot
# express "this one string in a blocking family is not actually
# legally-sensitive". If that case ever arises, the answer is a per-entry
# `exceptions` list below with a reason and a reviewer — NOT a narrowed prefix,
# because narrowing silently drops every future sibling too.
# ---------------------------------------------------------------------------

[meta]
source = "company/design/COPY-DECK.md §2 and §11"
match = "prefix"            # a msgctxt (deck key) matches if it starts with any `keys` entry
fail_closed = true          # an unmatched key is NOT blocking; an unreviewed blocking key keeps the flag false
slice_written = "S1"
# The number of blocking-class strings present in locale/ta/LC_MESSAGES/django.po
# at the time of writing, recorded so a later reader can tell whether the
# catalogue grew without the gate being re-examined. It is NOT a coverage claim.
blocking_strings_in_catalogue_at_S1 = 64
blocking_strings_without_a_tamil_draft_at_S1 = 46

# S2 (2026-10-22). Measured the same way, by matching every msgctxt in
# `locale/ta/LC_MESSAGES/django.po` against the prefixes below.
#
# **The prefix rule did the job it was written for.** S2 added the first B4
# strings with a real figure beside them — `price.*`, `sell.price.*`,
# `listing.price.row` — and every one of them was blocking on arrival with
# nobody remembering to extend anything. An enumerated list would have needed
# an edit, and the edit is the step that gets skipped.
blocking_strings_in_catalogue_at_S2 = 86
blocking_strings_without_a_tamil_draft_at_S2 = 60
total_strings_in_catalogue_at_S2 = 254

# S2 rework (2026-10-22), closing REDTEAM-S2 F48 — the photo strip.
#
# **The prefix rule was about to miss one, and the fix was to rename our own
# key rather than touch this file** (CLAUDE.md rule 13, first resort). The
# photo's alt text — *"Photo 2 of 4, uploaded by the seller"* — is a
# no-warranty string in every sense B2's `why` describes: its entire
# engineering is that BookHop makes no claim about an image nobody here has
# looked at, and a natural-sounding Tamil rendering ("விற்பவர் சரிபார்த்த
# படம்" — the seller's checked photo) would warrant in a language
# `test_forbidden_copy.py` cannot read. It was drafted as
# `listing.photo.alt`, which no prefix here matches. Renaming it to
# **`trust.photo.alt`** made it blocking on arrival, cost one key name, and
# added nothing to this file — which is the point of the ordering in rule 13.
#
# `listing.photo.open` ("open the full-size photo") and `search.photos_gate`
# ("Show {n} photos (about {kb} KB)") are deliberately NOT blocking: one is a
# navigation instruction and the other a byte cost. Neither makes a claim
# about a book, a person or a price. Recorded so the omission reads as a
# decision rather than an oversight.
# **These three are NOT comparable with the `_at_S2` row above.** They were
# produced by a different instrument — every `\n\n`-separated block carrying a
# `msgctxt`, matched against the prefixes in this file — which counts the
# same catalogue at the S2 commit as 260 / 88 / 62, not 254 / 86 / 60. The
# earlier method is not recorded, so the discrepancy cannot be explained and
# is not explained away (rule 9). What IS measured is the **delta across this
# change, by one instrument**: +2 strings (one removed, three added),
# +1 blocking, +0 without a Tamil draft — `trust.photo.alt` arrives with one.
measured_by = "msgctxt blocks in locale/ta/LC_MESSAGES/django.po, prefix-matched against classes.*.keys"
blocking_strings_in_catalogue_at_S2_rework = 89
blocking_strings_without_a_tamil_draft_at_S2_rework = 62
total_strings_in_catalogue_at_S2_rework = 262

# A-29/A-30 rework (2026-10-22) — one string, and the key-prefix decision was
# made deliberately for the second time this slice rather than by default.
#
# `trust.book.withheld` is the sentence a student is shown where a title would
# be, on a `books` row no staff member has read. **It is the paradigm B2
# string, not a borderline one:** its entire content is a negation — nobody
# here has read this, so BookHop is not repeating it — and B2's `why` is
# precisely that *"a natural-sounding Tamil rendering is very likely to
# over-promise"*. Tamil reaches a negation through a participle, and
# `படிக்கப்பட்ட` / `சரிபார்க்கப்பட்ட` ("read" / "checked", as an attribute of
# the entry) is one keystroke of drift away from the positive claim the gate
# exists to stop. `test_forbidden_copy.py` reads English only (TR-8), so that
# drift would ship green. The closing clause is the second hazard:
# "the ISBN identifies the edition" rendered with `உறுதிப்படுத்துகிறது`
# ("confirms") would warrant the correctness of data nobody checked.
#
# **The prefix did the work and this file needed no edit** (CLAUDE.md rule 13,
# first resort). Drafted as `listing.book.withheld`, which no prefix here
# matches; keyed `trust.book.withheld` instead, which is blocking on arrival.
# That is the same move `trust.photo.alt` made earlier in this slice, made on
# its own reasoning rather than copied — the test is whether the string's job
# is to withhold a warranty, and this one's job is nothing else.
#
# `[classes]` and `[exceptions]` are unchanged. The three numbers below are
# the same instrument as the `_at_S2_rework` row above, which it reproduces
# exactly on the parent commit (262 / 89 / 62) — so the delta is measured and
# not inferred: **+1 string, +1 blocking, +0 without a Tamil draft**, because
# `trust.book.withheld` arrives with one. The draft is unreviewed, which is
# the gated state; `REVIEWED.toml` is untouched and carries no name for it.
# The reviewer's three questions are COPY-DECK §11 **TR-13**.
blocking_strings_in_catalogue_at_A29_label = 90
blocking_strings_without_a_tamil_draft_at_A29_label = 62
total_strings_in_catalogue_at_A29_label = 263

# --- B1 ---------------------------------------------------------------------
[classes.B1]
scope = "COPY-DECK §7 — the handover guidance"
why = """
A mistranslation here is a safety and liability problem, not an awkward one. If
the Tamil accidentally warrants anything, we have warranted it. API-CONTRACT
§5.4 makes showing this notice a precondition of reaching SCHEDULED, so the
Tamil is served at the moment two students are about to meet a stranger.
"""
keys = ["hand.guidance", "hand.agree", "hand.scheduled", "hand.reminder"]
present_in_catalogue = false
note = "No B1 string exists yet — the handover flow is slice S5. The prefix is declared now so the first one written is blocking on arrival."

# --- B2 ---------------------------------------------------------------------
[classes.B2]
scope = "COPY-DECK §3 — every no-warranty string"
why = """
The English is engineered word by word to describe a mechanism and never to
promise. A natural-sounding Tamil rendering is very likely to over-promise, and
`tests/unit/test_forbidden_copy.py` reads English only (THREAT-MODEL risk A9),
so a warranting Tamil string would pass every check we have.
"""
keys = ["trust."]
present_in_catalogue = true
reviewer_must_confirm = ["TR-1", "TR-12"]

# --- B3 ---------------------------------------------------------------------
[classes.B3]
scope = "COPY-DECK §9, §10.3, §10.4 — reporting, grievance, age gate, consent, erase"
why = """
These carry statutory meaning (DPDP, IT Rules, E-Com rules) and the wording is
a compliance artefact, not prose. `consent.listing_publication.disclosure` is a
named condition of COMPLIANCE §2.5a; `erase.confirm.retained` is the r.8(3)
disclosure; `age.rejected` is the AC-A2.3 refusal. A Tamil rendering that drifts
is a defective legal notice served to the student least able to check it.
"""
keys = [
  "age.",
  "consent.",
  "erase.",
  "privacy.",
  "report.",
  "grievance.",
  "dispute.",
  "block.",
  "legal.",
]
present_in_catalogue = true
reviewer_must_confirm = ["TR-4", "TR-9", "TR-12"]

# --- B4 ---------------------------------------------------------------------
[classes.B4]
scope = "COPY-DECK §3.1 — the negotiability strings"
why = """
Each one carries a limb of the s194-O position (COMPLIANCE §4.3.1). A Tamil
rendering that reads as "the price is Rs 280" rather than "Rs 280 is what the
seller is asking for" would weaken a tax position in a language the
forbidden-string test cannot read. COPY-DECK §2: "of the four blocking classes
this is the one where a wrong translation is least visible to us and most
expensive."
"""
keys = ["price.", "hand.price", "listing.price", "sell.price", "search.filter.price"]
present_in_catalogue = true
reviewer_must_confirm = ["TR-11"]

# --- Exceptions -------------------------------------------------------------
# Empty, and it must stay empty unless a named human puts something in it. An
# entry here removes a string from the gate, so it needs the same standing as a
# REVIEWED.toml entry: a reason and a reviewer who is a person.
[exceptions]
